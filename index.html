<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pixelart.js</title>
    <link rel="stylesheet" href="styles.css">
    <script src="jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <div id="tools">
      <button id="select">select</button>
      <button id="brush">brush</button>
      <button id="spray">spray</button>
      <button id="pen">pen</button>
      <button id="eraser">eraser</button>
      <button id="circle">circle</button>
      <button id="rect">rect</button>
      <button id="tri">tri</button>
    </div>

    <canvas id="canvas" width="600" height="400"></canvas>

    <div id="settings">
      <h2 class="title">--- Settings ---</h2>
      <div>
        <label for="overlay">Enable grid overlay?</label>
        <input type="checkbox" id="overlay" name="overlay">
      </div>
      <div>
        <label for="overlay">Stroke size</label>
        <input type="range" min="1" max="20" id="stroke" name="stroke">
      </div>
      <div>
        <label for="overlay">Color</label>
        <input type="color" id="color" name="color">
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
